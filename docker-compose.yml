services:

  # ── Infrastructure ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       dashmet
      POSTGRES_USER:     dashmet
      POSTGRES_PASSWORD: dashmet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashmet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend ───────────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://dashmet:dashmet@host.docker.internal:5432/dashmet
      - REDIS_URL=redis://host.docker.internal:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://dashmet:dashmet@host.docker.internal:5432/dashmet
      - REDIS_URL=redis://host.docker.internal:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Concurrency is the per-container throughput ceiling. Safe to raise now that
    # rate-limit backoff is non-blocking + connection-scoped (a paused token no
    # longer pins idle slots). For production scale, also run multiple replicas
    # (e.g. k8s Deployment / `docker compose up --scale celery-worker=N`).
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4 --queues=meta,default

  celery-worker-tiktok:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://dashmet:dashmet@host.docker.internal:5432/dashmet
      - REDIS_URL=redis://host.docker.internal:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4 --queues=tiktok

  celery-poll-worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://dashmet:dashmet@host.docker.internal:5432/dashmet
      - REDIS_URL=redis://host.docker.internal:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2 --queues=poll

  celery-beat:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://dashmet:dashmet@host.docker.internal:5432/dashmet
      - REDIS_URL=redis://host.docker.internal:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A workers.celery_app beat --loglevel=info

  # ── Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: ./frontend/.env.local
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
